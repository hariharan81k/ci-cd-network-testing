
name: Intentional CI Failure Demo

on:
  workflow_dispatch:

jobs:
  demonstrate-failure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      - name: Run intentional failing test
        run: python -m pytest -v tests/test_failure_demo.py
