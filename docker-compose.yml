
services:
  user-service:
    build:
      context: ./test_services/user_service
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway-service:
    build:
      context: ./test_services/gateway_service
    ports:
      - "8001:8000"
    environment:
      USER_SERVICE_URL: http://user-service:8000
      GATEWAY_PORT: "8000"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
